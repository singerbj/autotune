[package]
name = "tuner-audio"
description = "AudioBackend trait, WASAPI (+ optional ASIO) backends, lock-free rings and adaptive resampling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# ASIO capture/render through cpal. Requires the Steinberg ASIO SDK at build
# time (see docs/decisions/0004-asio-feature.md).
asio = ["dep:cpal", "cpal/asio"]
serde = ["dep:serde"]
specta = ["dep:specta"]

[dependencies]
thiserror.workspace = true
rtrb.workspace = true
rubato.workspace = true
serde = { workspace = true, optional = true }
specta = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.16", optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Security",
    "Win32_System_Registry",
] }

[lints]
workspace = true
