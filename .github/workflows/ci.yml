# PR checks and main-branch CI.
#
# Every job maps to a rule in REQUIREMENTS.md; `ci-success` aggregates them so
# branch protection only needs one required check.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Portable crates: everything below the Tauri app.
  CORE_CRATES: -p tuner-dsp -p tuner-cli -p tuner-audio -p tuner-engine -p tuner-win

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (oxlint, oxfmt, tsc, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w ui
      - run: npm run build -w ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 3

  rust-lint:
    name: Rust fmt + clippy (windows)
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-debug
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: Rust tests + bindings (windows)
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-debug
      - run: cargo test --workspace --locked
      - name: tauri-specta bindings are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- ui/src/bindings.ts; then
            echo "::error file=ui/src/bindings.ts::Generated bindings are stale. Run 'npm run bindings' and commit the result."
            exit 1
          fi

  rust-portable:
    name: Core crates (linux, mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy $CORE_CRATES --all-targets --locked -- -D warnings
      - run: cargo test $CORE_CRATES --locked

  asio:
    name: ASIO backend builds (feature `asio`)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-asio
      # asio-sys downloads the Steinberg SDK and runs bindgen (LLVM is on the image).
      - run: cargo clippy -p tuner-audio -p tuner-engine --features tuner-audio/asio --all-targets --locked -- -D warnings

  bench-gate:
    name: NFR-03 benchmark gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-bench
      - run: cargo bench -p tuner-dsp --bench process --locked -- --warm-up-time 2 --measurement-time 5 --noplot
      - name: 128-sample block < 0.27 ms
        shell: pwsh
        run: ./scripts/bench-gate.ps1 -BudgetNs 270000

  soak:
    name: 1-hour offline soak under assert_no_alloc
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-soak
      - run: cargo test -p tuner-dsp --profile soak --locked --test no_alloc -- --ignored soak

  licenses:
    name: License + advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: "1.94.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm license check
        run: npx --yes license-checker-rseidelsohn@5 --production --excludePrivatePackages --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;Unlicense;MIT-0;Python-2.0;CC-BY-4.0"

  installer-scripts:
    name: Installer scripts (PSScriptAnalyzer + Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          # PSGallery lookups fail intermittently ("No match was found"); retry.
          foreach ($m in @(@{ Name = 'PSScriptAnalyzer'; Min = '1.0' }, @{ Name = 'Pester'; Min = '5.5' })) {
            for ($i = 1; $i -le 4; $i++) {
              try {
                Install-Module $m.Name -MinimumVersion $m.Min -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
                break
              } catch {
                if ($i -eq 4) { throw }
                Write-Output "Install-Module $($m.Name) failed (attempt $i): $_; retrying"
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
      - name: Lint
        shell: pwsh
        run: |
          $issues = foreach ($p in 'installer', 'scripts') { Invoke-ScriptAnalyzer -Path $p -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost }
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'installer/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  release-scripts:
    name: Release scripts (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test scripts/release/*.test.ts
      - name: The version and tag resolve
        run: echo "$(node scripts/release/version.ts tag) (previous $(node scripts/release/version.ts previous-tag))"

  build:
    name: Build installer (Windows x64)
    needs: [rust-lint, rust-test]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-release
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npx tauri build --ci
      - name: Name it as the release does
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "expected one installer, found: $($installer.Name -join ', ')" }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item $installer[0].FullName dist/tunedup-setup.exe
          "tunedup-setup.exe: {0:N1} MB" -f ((Get-Item dist/tunedup-setup.exe).Length / 1MB)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunedup-windows-x64
          path: dist/tunedup-setup.exe
          if-no-files-found: error
          retention-days: 14

  install-e2e:
    name: Install, open, uninstall (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tunedup-windows-x64
      - name: Install silently
        run: ./scripts/install-e2e.ps1 -Installer "$PWD\tunedup-setup.exe" -Phase Install
      - name: Window opens as the signed-in user
        run: ./scripts/app-window-e2e.ps1 -Screenshot user.png
      - name: Window opens elevated as another admin account (as under Administrator Protection)
        run: ./scripts/app-window-e2e.ps1 -AsOtherAdmin -Screenshot other-admin.png
      - name: Uninstall silently
        if: success() || failure()
        run: ./scripts/install-e2e.ps1 -Phase Uninstall
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-window-${{ matrix.os }}
          path: "*.png"
          if-no-files-found: ignore

  ci-success:
    name: CI success
    if: always()
    needs: [pr-title, frontend, rust-lint, rust-test, rust-portable, asio, bench-gate, soak, licenses, installer-scripts, release-scripts, build, install-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
