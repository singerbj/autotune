version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      tauri:
        patterns: ["tauri*", "specta*"]
      windows:
        patterns: ["windows*"]
      rust-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned with `=` on purpose (beta; see tauri-specta docs).
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
