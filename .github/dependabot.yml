version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      tauri:
        patterns: ["tauri*", "specta*"]
      rust-minor:
        update-types: [minor, patch]
    ignore:
      # Must stay on the same version Tauri uses (0.62 today) or two copies
      # of the Windows bindings get linked and types stop matching. Bump
      # them together with Tauri instead.
      - dependency-name: windows
      - dependency-name: windows-core
      # Pinned with `=` on purpose (beta; see tauri-specta docs).
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
