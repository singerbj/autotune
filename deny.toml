# cargo-deny: license audit and supply-chain checks (ARCHITECTURE › Licenses).
# The app ships for Windows x64 only, so only that target's graph matters.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "BSD-1-Clause", # assert_no_alloc (debug-build allocator guard)
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are unpublished and proprietary until licensing is decided.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable); it is a build-time proc-macro
    # pulled in by specta. Revisit when specta 2.0 stable drops it.
    { id = "RUSTSEC-2024-0436", reason = "build-time only, via specta" },
]
