# Git hooks, installed automatically by `npm install` (root "prepare" script).
# Skip once with LEFTHOOK=0 git commit ...; see CONTRIBUTING.md.

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fail_text: "Run `cargo fmt --all`."
    oxfmt:
      root: "ui/"
      glob: "*.{ts,tsx,css,json}"
      exclude: "src/bindings.ts"
      run: npx oxfmt --check {staged_files}
      fail_text: "Run `npm run format -w ui`."
    oxlint:
      root: "ui/"
      glob: "*.{ts,tsx}"
      exclude: "src/bindings.ts"
      run: npx oxlint --deny-warnings {staged_files}
    bindings-not-hand-edited:
      glob: "ui/src/bindings.ts"
      run: >
        git diff --cached --quiet -- src-tauri crates &&
        { echo "ui/src/bindings.ts is generated by tauri-specta: change the Rust commands and run 'npm run bindings'."; exit 1; } ||
        exit 0

commit-msg:
  commands:
    conventional-commits:
      run: >
        head -n1 {1} | grep -Eq '^(Merge|Revert|fixup!|squash!)|^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$' ||
        (echo "Commit title must follow Conventional Commits, e.g. 'feat(dsp): add humanize (FR-07)'"; exit 1)

pre-push:
  parallel: true
  commands:
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    core-tests:
      run: cargo test -p tuner-dsp -p tuner-cli -p tuner-audio -p tuner-engine -p tuner-win
    ui-check:
      run: npm run check -w ui
